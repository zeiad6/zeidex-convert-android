<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Three things the app never does</title>
  <desc id="d">Animated cards: conversions stay offline, LocalDrop moves files over the local network with a QR pairing, and every update is checked against a SHA-256 digest and the signing certificate.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/><stop offset="1" stop-color="#0E1219"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131925"/><stop offset="1" stop-color="#0F141C"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F05A28" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F05A28" stop-opacity="0"/>
    </radialGradient>
    <style><![CDATA[
      .pulse { animation: pulse 4.2s ease-in-out infinite; }
      .p2 { animation-delay: 1.4s; } .p3 { animation-delay: 2.8s; }
      .packet { animation: packet 3.4s cubic-bezier(.45,0,.55,1) infinite; }
      .draw { stroke-dasharray: 46; animation: draw 4.2s ease-in-out infinite; }
      .hash { animation: hash 4.2s steps(1) infinite; }
      .h2 { animation-delay: 1.4s; } .h3 { animation-delay: 2.8s; }
      .float { animation: float 7s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .45; } 45% { opacity: 1; } }
      @keyframes packet { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateX(38px); opacity: 0; } }
      @keyframes draw { 0% { stroke-dashoffset: 46; } 35%, 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 46; } }
      @keyframes hash { 0%, 100% { opacity: .35; } 20%, 80% { opacity: 1; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .packet, .draw, .hash, .float { animation: none !important; }
      }
    ]]></style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <ellipse cx="600" cy="150" rx="560" ry="220" fill="url(#warm)"/>
  <rect x="0" width="1200" height="1" fill="#1E2734"/>

  <!-- ── card 1: offline ──────────────────────────────────────────── -->
  <g>
    <rect x="64" y="96" width="341" height="196" rx="20" fill="url(#card)" stroke="#232B3A"/>
  </g>
  <text x="85" y="122" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10" fill="#3E4A5C">01</text>
  <g class="float">
    <g transform="translate(352 142)">
      <circle r="30" fill="#0F1A16" stroke="#35D0A0" stroke-opacity="0.22"/>
      <path d="M0 -17 L13 -11 V1 C13 9 7 14 0 17 C-7 14 -13 9 -13 1 V-11 Z" fill="#35D0A0" fill-opacity="0.10" stroke="#35D0A0" stroke-opacity="0.65" stroke-width="1.2"/>
      <path d="M-6 0 L-1.5 5 L6.5 -4" fill="none" stroke="#35D0A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw"/>
    </g>
  </g>
  <g font-family="'Noto Sans Arabic','Vazirmatn','Segoe UI',system-ui,sans-serif">
    <text x="385" y="204" text-anchor="start" direction="rtl" font-size="15.5" font-weight="700" fill="#EEF2F9">بلا إنترنت</text>
    <text x="385" y="230" text-anchor="start" direction="rtl" font-size="11.5" fill="#7E8A9E">المحرّكات كلها داخل التطبيق. لا رفع،</text>
    <text x="385" y="248" text-anchor="start" direction="rtl" font-size="11.5" fill="#7E8A9E">ولا حساب، ولا طلب شبكة واحد.</text>
  </g>
  <text x="85" y="272" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" fill="#43B58C" letter-spacing="0.8">0 bytes uploaded</text>

  <!-- ── card 2: LocalDrop ────────────────────────────────────────── -->
  <g>
    <rect x="429" y="96" width="341" height="196" rx="20" fill="url(#card)" stroke="#232B3A"/>
  </g>
  <text x="450" y="122" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10" fill="#3E4A5C">02</text>
  <g transform="translate(717 142)">
    <circle r="30" fill="#141A25" stroke="#2B3444"/>
    <g transform="translate(-17 -11)">
      <rect x="0" y="0" width="14" height="23" rx="3.5" fill="none" stroke="#FF9A6E" stroke-width="1.3"/>
      <line x1="6" y1="19" x2="8" y2="19" stroke="#FF9A6E" stroke-width="1.3" stroke-linecap="round"/>
    </g>
    <g transform="translate(7 -8)">
      <rect x="0" y="0" width="19" height="12" rx="2" fill="none" stroke="#C7D0E0" stroke-width="1.3"/>
      <line x1="-2" y1="15" x2="21" y2="15" stroke="#C7D0E0" stroke-width="1.3" stroke-linecap="round"/>
    </g>
    <line x1="-9" y1="8" x2="0" y2="8" stroke="#3A4557" stroke-dasharray="2 3"/>
    <circle cx="-9" cy="8" r="2.2" fill="#35D0A0" class="packet"/>
  </g>
  <g font-family="'Noto Sans Arabic','Segoe UI',system-ui,sans-serif">
    <text x="750" y="204" text-anchor="start" direction="rtl" font-size="15.5" font-weight="700" fill="#EEF2F9">LocalDrop</text>
    <text x="750" y="230" text-anchor="start" direction="rtl" font-size="11.5" fill="#7E8A9E">نقل الملفات من الحاسوب إلى الهاتف</text>
    <text x="750" y="248" text-anchor="start" direction="rtl" font-size="11.5" fill="#7E8A9E">على شبكة Wi-Fi نفسها، بمسح QR.</text>
  </g>
  <text x="450" y="272" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" fill="#7E8A9E" letter-spacing="0.8">LAN only · no server</text>

  <!-- ── card 3: verified updates ─────────────────────────────────── -->
  <g>
    <rect x="794" y="96" width="341" height="196" rx="20" fill="url(#card)" stroke="#232B3A"/>
  </g>
  <text x="815" y="122" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10" fill="#3E4A5C">03</text>
  <g class="float"><g transform="translate(1082 142)">
    <circle r="30" fill="#141A25" stroke="#2B3444"/>
    <rect x="-13" y="-15" width="26" height="30" rx="4" fill="#0F1A16" stroke="#FF9A6E" stroke-opacity="0.55" stroke-width="1.2"/>
    <g stroke="#FF9A6E" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
      <line x1="-7" y1="-6" x2="7" y2="-6" class="hash"/>
      <line x1="-7" y1="0" x2="4" y2="0" class="hash h2"/>
      <line x1="-7" y1="6" x2="7" y2="6" class="hash h3"/>
    </g>
    <circle cx="13" cy="13" r="9" fill="#0F1A16" stroke="#35D0A0" stroke-width="1.2"/>
    <path d="M9 13 L12 16 L17 10" fill="none" stroke="#35D0A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g></g>
  <g font-family="'Noto Sans Arabic','Segoe UI',system-ui,sans-serif">
    <text x="1115" y="204" text-anchor="start" direction="rtl" font-size="15.5" font-weight="700" fill="#EEF2F9">تحديث موثّق</text>
    <text x="1115" y="230" text-anchor="start" direction="rtl" font-size="11.5" fill="#7E8A9E">كل تحديث يُفحص بـSHA-256 وببصمة</text>
    <text x="1115" y="248" text-anchor="start" direction="rtl" font-size="11.5" fill="#7E8A9E">شهادة التوقيع قبل أن يُثبَّت.</text>
  </g>
  <text x="815" y="272" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="9.5" fill="#7E8A9E" letter-spacing="0.8">d24bf9df… verified</text>
</svg>
