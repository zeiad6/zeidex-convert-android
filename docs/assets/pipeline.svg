<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">One reader, one block model, any writer</title>
  <desc id="d">Animated diagram: DOCX, XLSX, PPTX and EPUB are read into a single model of paragraphs and tables, then written out as PDF, DOCX, TXT or Markdown.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/><stop offset="1" stop-color="#0E1219"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131925"/><stop offset="1" stop-color="#10151E"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F05A28" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#F05A28" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F05A28" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F05A28" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1A212D" stroke-width="1"/>
    </pattern>
    <style><![CDATA[
      .dot-a { animation: travel 3.2s cubic-bezier(.4,0,.6,1) infinite; }
      .dot-b { animation: travel 3.2s cubic-bezier(.4,0,.6,1) infinite; animation-delay: 1.6s; }
      .dot-c { animation: travel 3.4s cubic-bezier(.4,0,.6,1) infinite; animation-delay: .6s; }
      .dash { animation: dash 1.6s linear infinite; }
      .stage { animation: stage 4.8s ease-in-out infinite; }
      .s1 { animation-delay: 0s; } .s2 { animation-delay: 1.6s; } .s3 { animation-delay: 3.2s; }
      .hover { animation: hover 6s ease-in-out infinite; }
      @keyframes travel { 0% { transform: translateX(0); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateX(72px); opacity: 0; } }
      @keyframes dash { to { stroke-dashoffset: -16; } }
      @keyframes stage { 0%, 100% { stroke-opacity: .25; } 12% { stroke-opacity: .85; } 34% { stroke-opacity: .25; } }
      @keyframes hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @media (prefers-reduced-motion: reduce) {
        .dot-a, .dot-b, .dot-c, .dash, .stage, .hover { animation: none !important; }
      }
    ]]></style>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#grid)" opacity="0.5"/>
  <ellipse cx="600" cy="120" rx="520" ry="200" fill="url(#warm)"/>
  <rect x="0" width="1200" height="1" fill="#1E2734"/>

  <!-- header (RTL) -->
  <g font-family="'Noto Sans Arabic','Vazirmatn','Segoe UI',system-ui,sans-serif">
    <text x="1136" y="52" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10" letter-spacing="2.4" fill="#F0906A">ONE READER · ONE MODEL · ANY WRITER</text>
    <text x="1136" y="92" text-anchor="start" direction="rtl" font-size="25" font-weight="700" fill="#EFF3FA">قراءة واحدة، ثم كتابة بأي صيغة</text>
    <text x="1136" y="118" text-anchor="start" direction="rtl" font-size="13" fill="#7E8A9E">كل مُدخَل يتحوّل إلى فقرات وجداول، وكل مُخرَج يُكتب من النموذج نفسه.</text>
  </g>

  <!-- ── panel 1: readers ─────────────────────────────────────────── -->
  <g class="stage s1">
    <rect x="64" y="146" width="280" height="176" rx="18" fill="url(#card)" stroke="#F05A28" stroke-opacity="0.25"/>
    <rect x="64" y="146" width="280" height="176" rx="18" fill="none" stroke="#F05A28" class="stage s1"/>
  </g>
  <g font-family="'Noto Sans Arabic','Segoe UI',system-ui,sans-serif">
    <text x="324" y="176" text-anchor="start" direction="rtl" font-size="12" fill="#8A97AC">قراءة</text>
    <text x="82" y="176" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10" fill="#4F5B6E">01</text>
  </g>
  <g font-family="ui-monospace,'SF Mono','Cascadia Mono',Menlo,monospace" font-size="10.5" text-anchor="middle">
    <rect x="88" y="196" width="112" height="38" rx="10" fill="#0E141D" stroke="#2B3444"/>
    <text x="144" y="220" fill="#C9D3E3">DOCX</text>
    <rect x="208" y="196" width="112" height="38" rx="10" fill="#0E141D" stroke="#2B3444"/>
    <text x="264" y="220" fill="#C9D3E3">XLSX</text>
    <rect x="88" y="242" width="112" height="38" rx="10" fill="#0E141D" stroke="#2B3444"/>
    <text x="144" y="266" fill="#C9D3E3">PPTX</text>
    <rect x="208" y="242" width="112" height="38" rx="10" fill="#0E141D" stroke="#2B3444"/>
    <text x="264" y="266" fill="#C9D3E3">EPUB</text>
  </g>
  <text x="204" y="306" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="9" fill="#5A6578">+ ODT · RTF · HTML · CSV · MD</text>

  <!-- connector 1 -->
  <g>
    <line x1="348" y1="234" x2="420" y2="234" stroke="#2B3444" stroke-width="1" stroke-dasharray="4 6" class="dash"/>
    <circle cx="348" cy="234" r="2.6" fill="#FF8A5C" class="dot-a"/>
    <path d="M414 229 L421 234 L414 239" fill="none" stroke="#F05A28" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ── panel 2: block model ─────────────────────────────────────── -->
  <g>
    <rect x="424" y="146" width="352" height="176" rx="18" fill="url(#card)" stroke="#24304A"/>
    <rect x="424" y="146" width="352" height="176" rx="18" fill="none" stroke="#FF8A5C" class="stage s2"/>
  </g>
  <g font-family="'Noto Sans Arabic','Segoe UI',system-ui,sans-serif">
    <text x="760" y="176" text-anchor="start" direction="rtl" font-size="12" fill="#8A97AC">نموذج واحد</text>
    <text x="442" y="176" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10" fill="#4F5B6E">02</text>
  </g>
  <g>
    <rect x="446" y="196" width="120" height="7" rx="3.5" fill="#3B4658"/>
    <rect x="446" y="212" width="176" height="7" rx="3.5" fill="#2C3646"/>
    <rect x="446" y="228" width="150" height="7" rx="3.5" fill="#2C3646"/>
    <g stroke="#33405A" stroke-width="1">
      <rect x="446" y="250" width="180" height="52" rx="6" fill="#0E141D"/>
      <line x1="506" y1="250" x2="506" y2="302"/>
      <line x1="566" y1="250" x2="566" y2="302"/>
      <line x1="446" y1="267" x2="626" y2="267"/>
      <line x1="446" y1="284" x2="626" y2="284"/>
    </g>
  </g>
  <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="8.5" fill="#55617A" text-anchor="middle">
    <text x="704" y="216">paragraphs</text>
    <text x="704" y="232">+</text>
    <text x="704" y="252">tables</text>
    <text x="704" y="272">= one model</text>
  </g>

  <!-- connector 2 -->
  <g>
    <line x1="780" y1="234" x2="852" y2="234" stroke="#2B3444" stroke-width="1" stroke-dasharray="4 6" class="dash"/>
    <circle cx="780" cy="234" r="2.6" fill="#FF8A5C" class="dot-c"/>
    <path d="M846 229 L853 234 L846 239" fill="none" stroke="#F05A28" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ── panel 3: writers ─────────────────────────────────────────── -->
  <g>
    <rect x="856" y="146" width="280" height="176" rx="18" fill="url(#card)" stroke="#24304A"/>
    <rect x="856" y="146" width="280" height="176" rx="18" fill="none" stroke="#35D0A0" class="stage s3"/>
  </g>
  <g font-family="'Noto Sans Arabic','Segoe UI',system-ui,sans-serif">
    <text x="1116" y="176" text-anchor="start" direction="rtl" font-size="12" fill="#8A97AC">كتابة</text>
    <text x="874" y="176" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10" fill="#4F5B6E">03</text>
  </g>
  <g class="hover">
    <g transform="translate(912 232)">
      <rect x="-30" y="-42" width="60" height="84" rx="7" fill="#F7F9FD"/>
      <path d="M18 -42 L30 -30 L30 -42 Z" fill="#DCE4F1"/>
      <rect x="-20" y="-26" width="26" height="4" rx="2" fill="#C9D3E4"/>
      <rect x="-20" y="-16" width="40" height="4" rx="2" fill="#DDE5F1"/>
      <rect x="-20" y="-6" width="32" height="4" rx="2" fill="#DDE5F1"/>
      <rect x="-20" y="14" width="30" height="13" rx="4" fill="#F05A28"/>
      <text x="-5" y="24" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="8" font-weight="700" fill="#fff" letter-spacing="0.6">PDF</text>
    </g>
  </g>
  <g font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10" text-anchor="middle">
    <rect x="968" y="200" width="146" height="30" rx="9" fill="#0E141D" stroke="#2B3444"/>
    <text x="1041" y="219" fill="#C9D3E3">DOCX</text>
    <rect x="968" y="238" width="146" height="30" rx="9" fill="#0E141D" stroke="#2B3444"/>
    <text x="1041" y="257" fill="#C9D3E3">TXT</text>
    <rect x="968" y="276" width="146" height="30" rx="9" fill="#0E141D" stroke="#2B3444"/>
    <text x="1041" y="295" fill="#C9D3E3">MARKDOWN</text>
  </g>

  <!-- footer line -->
  <text x="1136" y="352" text-anchor="start" direction="rtl" font-family="'Noto Sans Arabic','Segoe UI',system-ui,sans-serif" font-size="11" fill="#5A6578">بلا مكتبة خارجية، وبلا شبكة</text>
  <text x="912" y="352" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10" fill="#4E5A6D">DocumentConverter.convert()</text>
</svg>
