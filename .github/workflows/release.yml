name: Android Signed Release & Resumable Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'Zeidex Convert Android v1.0.0 (Signed Release)'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle Build Cache & Resumption Data
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/configuration-cache
            app/build/intermediates
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-release-
            ${{ runner.os }}-gradle-

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Prepare Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Never mint a key here. A tag built with a fresh keystore publishes an APK that no
          # existing install can upgrade, because Android only replaces an app when the signer
          # matches. That is how the v1.2.0 asset ended up signed by a different key.
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error title=Missing signing key::RELEASE_KEYSTORE_BASE64 and KEYSTORE_PASSWORD must be set as repository secrets. Generating a new key at release time breaks every future update."
            exit 1
          fi
          mkdir -p keystore app/keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/release.keystore
          cp keystore/release.keystore app/keystore/release.keystore

      - name: Build Signed Release APK & Bundle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          export KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          export KEY_ALIAS="${KEY_ALIAS:-zeidex}"
          export KEY_PASSWORD="$KEYSTORE_PASSWORD"
          ./gradlew assembleRelease bundleRelease --build-cache --no-daemon

      - name: Verify Signed APK with Apksigner
        env:
          EXPECTED_CERT_SHA256: "d24bf9dfb3f1b9acb0f48fb1940b3eacc3875cdb19e7869f4b1281fdecb9366e"
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found release APK at: $APK_PATH"
          if command -v apksigner &> /dev/null; then
            APKSIGNER=apksigner
          else
            APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          fi
          "$APKSIGNER" verify --verbose "$APK_PATH"
          SIGNER=$("$APKSIGNER" verify --print-certs "$APK_PATH" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | tr -d '\r' | head -n 1)
          echo "Signer: $SIGNER"
          if [ "$SIGNER" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error title=Wrong signing key::$APK_PATH is signed by $SIGNER, not the official $EXPECTED_CERT_SHA256. Refusing to publish."
            exit 1
          fi

      - name: Package Artifacts & Generate SHA-256 Checksums
        run: |
          mkdir -p release_assets
          TAG_NAME="${{ inputs.version_tag }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "null" ]; then
            TAG_NAME="${{ github.ref_name }}"
          fi
          
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_FILE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          
          cp "$APK_FILE" "release_assets/zeidex-convert-${TAG_NAME}.apk"
          if [ -f "$AAB_FILE" ]; then
            cp "$AAB_FILE" "release_assets/zeidex-convert-${TAG_NAME}.aab"
          fi
          
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts (Resumable storage)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: zeidex-convert-signed-release
          path: release_assets/
          retention-days: 90

      - name: Create or Update GitHub Release with Resumable Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.version_tag }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "null" ]; then
            TAG_NAME="${{ github.ref_name }}"
          fi
          TITLE="${{ inputs.release_title }}"
          if [ -z "$TITLE" ] || [ "$TITLE" = "null" ]; then
            TITLE="Zeidex Convert Android ${TAG_NAME} (Signed Release)"
          fi

          cat << 'EOF' > release_notes.md
          ### Zeidex Convert for Android (Signed Release)

          100% Offline & Private Local File Converter.

          #### What is in this release:
          - Signed APK: Direct install on Android 8.0+
          - Android App Bundle (AAB): For Google Play and distribution
          - Checksums: SHA256SUMS.txt
          - Resumable Conversions: In-app task pause, resume, and persistent task recovery
          - Offline conversions: no analytics and no uploads. The only network use is the optional update check.
          EOF

          echo "Uploading release assets for $TAG_NAME..."
          MAX_RETRIES=5
          COUNT=0
          SUCCESS=0
          
          while [ $COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((COUNT+1)) to upload release assets..."
            if gh release view "$TAG_NAME" > /dev/null 2>&1; then
              gh release upload "$TAG_NAME" release_assets/* --clobber && SUCCESS=1 && break
            else
              gh release create "$TAG_NAME" release_assets/* --title "$TITLE" --notes-file release_notes.md && SUCCESS=1 && break
            fi
            COUNT=$((COUNT+1))
            sleep 5
          done
          
          if [ $SUCCESS -ne 1 ]; then
            echo "Failed to upload release after $MAX_RETRIES attempts."
            exit 1
          fi
          echo "Release created and signed assets uploaded successfully!"
